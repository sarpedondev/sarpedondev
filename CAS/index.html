<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TI-Nspire CAS Clone</title>

  <!-- PWA & iOS Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- Use black-translucent so the app goes fully edge-to-edge on iPad -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CAS App" />
  <link rel="apple-touch-icon" href="icons/apple-icon-180.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              "-apple-system",
              "BlinkMacSystemFont",
              '"Segoe UI"',
              "Roboto",
              "Helvetica",
              "Arial",
              "sans-serif",
            ],
          },
          keyframes: {
            blink: {"0%, 100%": {opacity: "1"}, "50%": {opacity: "0"}},
          },
          animation: {blink: "blink 1.2s step-end infinite"},
        },
      },
    };
  </script>
</head>

<body class="h-screen flex flex-col overflow-hidden bg-[#D4D4DB] select-none antialiased text-slate-900 font-sans">
  <!-- 1. Top Bar (Green) - Taller for bigger icons -->
  <div class="h-[52px] bg-[#31B222] flex justify-between items-center px-4 shrink-0">
    <!-- Left Nav Actions -->
    <div class="flex items-center gap-6 text-white">
      <!-- Back / Exit -->
      <div class="flex items-center gap-1 cursor-pointer hover:opacity-75">
        <img src="icons/chevron-left.svg" alt="Back" class="w-[24px] h-[24px]" />
        <span class="text-[17px] font-medium tracking-tight">Exit</span>
      </div>

      <!-- Top Left Icons -->
      <img src="icons/plus.svg" alt="Add" class="w-[26px] h-[26px] cursor-pointer hover:opacity-75" />
      <img src="icons/undo.svg" alt="Undo" class="w-[26px] h-[26px] cursor-pointer hover:opacity-75" />
      <img src="icons/redo.svg" alt="Redo" class="w-[26px] h-[26px] cursor-pointer hover:opacity-75" />
      <img src="icons/broom.svg" alt="Clear" class="w-[24px] h-[24px] cursor-pointer hover:opacity-75" />
    </div>

    <!-- Right Nav Status & Icons -->
    <div class="flex items-center gap-5 text-white">
      <!-- Text Elements -->
      <span class="text-[14px] font-medium tracking-wide">CAS</span>
      <span class="text-[14px] font-medium tracking-wide">Code: 0000-0000</span>
      <span class="text-[14px] font-medium tracking-wide">00:37</span>

      <!-- Top Right Icons -->
      <img src="icons/info.svg" alt="Info" class="w-[24px] h-[24px] cursor-pointer hover:opacity-75" />
      <img src="icons/gear.svg" alt="Settings" class="w-[24px] h-[24px] cursor-pointer hover:opacity-75" />
    </div>
  </div>

  <!-- 2. Sub Toolbar (Gray) -->
  <div class="h-[46px] bg-[#8E8E98] flex items-center border-b border-[#7C7C8A] shrink-0">
    <!-- 1.1 Tab (Wider: 60px) -->
    <div
      class="w-[60px] h-full bg-[#ABABBA] text-[#F9F9F9] flex items-center justify-center text-[15px] font-medium border-r border-[#7C7C8A]">
      1.1
    </div>

    <!-- Sub-Toolbar Icons -->
    <div class="flex gap-7 pl-6">
      <img src="icons/wrench.svg" alt="Tools" class="w-[22px] h-[22px] cursor-pointer hover:opacity-75" />
      <img src="icons/sliders.svg" alt="Properties" class="w-[22px] h-[22px] cursor-pointer hover:opacity-75" />
    </div>
  </div>

  <!-- 3. App Body (Sidebar + Paper) -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Left Sidebar (Wider: 50px, perfectly centered) -->
    <!-- Using flex-col, items-center to strictly center contents horizontally -->
    <div class="w-[50px] bg-[#D4D4DB] flex flex-col items-center pt-5 gap-7 shrink-0">
      <div class="text-[12px] text-[#555] font-semibold tracking-wider text-center w-full">
        DEG
      </div>

      <!-- Sidebar Icons -->
      <img src="icons/split-view.svg" alt="Split View" class="w-[26px] h-[26px] cursor-pointer hover:opacity-75" />
      <img src="icons/book.svg" alt="Catalog" class="w-[26px] h-[26px] cursor-pointer hover:opacity-75" />
    </div>

    <!-- Empty 10px gray gap (50px + 10px = 60px. Perfectly aligns with tab above) -->
    <div class="w-[10px] bg-[#D4D4DB] shrink-0"></div>

    <!-- Right Workspace Area (White Paper) -->
    <div
      class="flex-1 bg-[#FDFDFD] border-l border-[#C2C2CA] shadow-[-3px_0_12px_rgba(0,0,0,0.04)] p-6 cursor-text relative">
      <span class="font-mono text-[24px] font-light text-black animate-blink absolute top-4 left-6">|</span>
    </div>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>

</html>
