<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TI-Nspire CAS Clone</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              "-apple-system",
              "BlinkMacSystemFont",
              '"Segoe UI"',
              "Roboto",
              "Helvetica",
              "Arial",
              "sans-serif",
            ],
          },
          keyframes: {
            blink: {"0%, 100%": {opacity: "1"}, "50%": {opacity: "0"}},
          },
          animation: {blink: "blink 1.2s step-end infinite"},
        },
      },
    };
  </script>
</head>

<body class="h-screen flex flex-col overflow-hidden bg-[#D4D4DB] select-none antialiased text-slate-900 font-sans">
  <!-- 1. Top Bar (Green) - Status bar removed -->
  <div class="h-[48px] bg-[#31B222] flex justify-between items-center px-3 shrink-0">
    <!-- Left Nav Actions -->
    <div class="flex items-center gap-[22px] text-white">
      <!-- Back / Exit -->
      <div class="flex items-center gap-1 cursor-pointer hover:opacity-75">
        <img src="icons/chevron-left.svg" alt="Back" class="w-[22px] h-[22px]" />
        <span class="text-[15px] font-medium tracking-tight">Exit</span>
      </div>

      <!-- Top Left Icons -->
      <img src="icons/plus.svg" alt="Add" class="w-6 h-6 cursor-pointer hover:opacity-75" />
      <img src="icons/undo.svg" alt="Undo" class="w-[22px] h-[22px] cursor-pointer hover:opacity-75" />
      <img src="icons/redo.svg" alt="Redo" class="w-[22px] h-[22px] cursor-pointer hover:opacity-75" />
      <img src="icons/broom.svg" alt="Clear" class="w-[20px] h-[20px] cursor-pointer hover:opacity-75" />
    </div>

    <!-- Right Nav Status & Icons -->
    <div class="flex items-center gap-[18px] text-white">
      <!-- Text Elements -->
      <span class="text-[13px] font-medium tracking-wide">CAS</span>
      <span class="text-[13px] font-medium tracking-wide">Code: 0000-0000</span>
      <span class="text-[13px] font-medium tracking-wide">00:37</span>

      <!-- Top Right Icons -->
      <img src="icons/info.svg" alt="Info" class="w-[20px] h-[20px] cursor-pointer hover:opacity-75" />
      <img src="icons/gear.svg" alt="Settings" class="w-[20px] h-[20px] cursor-pointer hover:opacity-75" />
    </div>
  </div>

  <!-- 2. Sub Toolbar (Gray) -->
  <div class="h-[42px] bg-[#8E8E98] flex items-center border-b border-[#7C7C8A] shrink-0">
    <!-- 1.1 Tab (54px wide. Offsets perfectly with the 44px sidebar + 10px gap below) -->
    <div
      class="w-[54px] h-full bg-[#ABABBA] text-[#F9F9F9] flex items-center justify-center text-[13px] font-medium border-r border-[#7C7C8A]">
      1.1
    </div>

    <!-- Sub-Toolbar Icons -->
    <div class="flex gap-6 pl-5">
      <img src="icons/wrench.svg" alt="Tools" class="w-[18px] h-[18px] cursor-pointer hover:opacity-75" />
      <img src="icons/sliders.svg" alt="Properties" class="w-[18px] h-[18px] cursor-pointer hover:opacity-75" />
    </div>
  </div>

  <!-- 3. App Body (Sidebar + Paper) -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Very Thin Left Sidebar (44px) -->
    <div class="w-[44px] bg-[#D4D4DB] flex flex-col items-center pt-[18px] gap-[26px] shrink-0">
      <div class="text-[10px] text-[#555] font-semibold tracking-wider">
        DEG
      </div>

      <!-- Sidebar Icons -->
      <img src="icons/split-view.svg" alt="Split View" class="w-5 h-5 cursor-pointer hover:opacity-75" />
      <img src="icons/book.svg" alt="Catalog" class="w-5 h-5 cursor-pointer hover:opacity-75" />
    </div>

    <!-- Empty 10px gray gap (This perfectly matches the 54px tab border with the 44px sidebar) -->
    <div class="w-[10px] bg-[#D4D4DB] shrink-0"></div>

    <!-- Right Workspace Area (White Paper) -->
    <div
      class="flex-1 bg-[#FDFDFD] border-l border-[#C2C2CA] shadow-[-3px_0_12px_rgba(0,0,0,0.04)] p-6 cursor-text relative">
      <span class="font-mono text-[22px] font-light text-black animate-blink absolute top-4 left-6">|</span>
    </div>
  </div>
</body>

</html>
